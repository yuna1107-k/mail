# 大学メール転送スクリプトの設定ファイル
#
# 1. このファイルを config.ini という名前でコピーする
# 2. パスワードが入るので、必ず chmod 600 config.ini を実行する
# 3. 値は Thunderbird のアカウント設定と同じものを書く
#
# ※コメントは行頭の # だけ。値の後ろにコメントを書くと値の一部になります。

[imap]
# Thunderbird: アカウント設定 →「サーバー設定」のサーバー名
host = imap.example.ac.jp
# 993 (SSL/TLS) が一般的
port = 993
# ssl / starttls / none（Thunderbird の「接続の保護」: SSL/TLS → ssl、STARTTLS → starttls）
security = ssl
# Thunderbird の「ユーザー名」
user = s0000000
password =
# 転送の対象にするフォルダ
#   INBOX          … 受信箱だけ（既定）
#   *              … すべてのフォルダ（送信済み・下書き・ゴミ箱・迷惑メールは自動で除外）
#   INBOX, 講義    … カンマ区切りで指定（日本語のフォルダ名もそのまま書ける）
folder = INBOX
# folder = * のとき、ほかに除外したいフォルダ（カンマ区切り。サブフォルダは「親/子」のように区切り文字込みで書く）
exclude_folders =

[smtp]
# Thunderbird: アカウント設定 →「送信 (SMTP) サーバー」
host = smtp.example.ac.jp
# 587 (STARTTLS) か 465 (SSL/TLS) が一般的
port = 587
security = starttls
# 空なら [imap] の user / password を使う
user =
password =

[forward]
# 転送先（複数あるときはカンマ区切り）
to = yourname@gmail.com
# 差出人にする自分の大学メールアドレス（空なら [imap] の user がアドレス形式のときだけそれを使う）
from = s0000000@example.ac.jp
# 新着を確認する間隔（秒、最小 15）
poll_interval = 60
# これより大きいメールは元メールを添付せず、本文だけ転送する（MB）
max_attach_mb = 20

[filter]
# 空なら全部転送。カンマ区切りで、どれかを含むものだけ転送（大文字小文字は区別しない）
# 両方書いたときは「差出人の条件」と「件名の条件」を両方満たすものだけ転送
from_contains =
subject_contains =
